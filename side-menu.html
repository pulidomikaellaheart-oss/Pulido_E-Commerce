<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEARTIE — Side Menu Bar</title>
    <link rel="stylesheet" href="side-menu.css">
</head>
<body>

    <div class="sidebar">
        
        <div class="store-name">HEARTIE</div>

        <div class="menu-group">
            <div class="group-title">Main Navigation</div>
            <a href="#" class="menu-item" id="menu-home">Home</a>
            <a href="#" class="menu-item" id="menu-products">Products</a>
            <a href="#" class="menu-item active" id="menu-categories">Categories</a>
        </div>

        <div class="menu-group">
            <div class="group-title">Shopping</div>
            <a href="#" class="menu-item" id="menu-cart">Cart</a>
            <a href="#" class="menu-item" id="menu-orders">My Orders</a>
            <a href="#" class="menu-item" id="menu-wishlist">Wishlist</a>
        </div>

        <div class="menu-group">
            <div class="group-title">Account</div>
            <a href="#" class="menu-item" id="menu-profile">Profile</a>
            <a href="#" class="menu-item" id="menu-settings">Settings</a>
        </div>

        <div class="menu-group">
            <div class="group-title">System</div>
            <a href="#" class="menu-item logout" id="menu-logout">Logout</a>
        </div>
    </div>

    <div class="main-content">
        <h1>Welcome to HEARTIE!</h1>
        <p>This is a simple webpage with a side menu bar.</p>
        <p>The side menu contains items commonly found in an e-commerce website.</p>
    </div>

    <script src="side-menu.js"></script>
</body>
</html>
