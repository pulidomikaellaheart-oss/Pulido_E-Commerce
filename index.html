<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="nav-link" onclick="setActiveNav(this)">Home</a>
            <a href="#" class="nav-link" onclick="setActiveNav(this)">About</a>
            <a href="#" class="nav-link active" onclick="setActiveNav(this)">Services</a>
            <a href="#" class="nav-link" onclick="setActiveNav(this)">Contact</a>
        </div>
        <div class="search">
            <input type="text" placeholder="Search_">
            <button>🔍</button>
        </div>
    </nav>

    <div class="container">
        <div class="login-box">
            <h2>Sign In</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <div class="error" id="emailErr"></div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <div class="error" id="passErr"></div>
                </div>

                <div class="row">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="btn">Sign In</button>

                <div class="bottom">
                    Don't have an account? <a href="#">Sign up</a>
                </div>
            </form>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
